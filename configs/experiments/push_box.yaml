# Phase-2 milestone experiment: recover friction from a push episode.
# Synthetic ground truth = 0.8, calibration starts from 0.2.

defaults: ../default.yaml

experiment_id: push_box_001

robot: franka

object:
  object_id: box_01
  shape: box
  size: [0.06, 0.06, 0.06]
  physics:
    mass: 0.42
    friction_dynamic: 0.2     # deliberately wrong initial guess
    restitution: 0.1

simulation:
  backend: mock
  dt: 0.002
  settle_time: 0.5

calibration:
  optimizer: grid
  parameters:
    friction:
      min: 0.05
      max: 1.5
      step: 0.05
      initial: 0.2

loss:
  position_weight: 1.0
  rotation_weight: 0.0

evaluation:
  resample_rate: 30.0
